<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Revani</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <iframe src="header.html" class="header-frame" title="Header"></iframe>
    <iframe src="nav.html" class="nav-frame" title="Navigasi"></iframe>

    <div class="container-fluid px-4 mt-4">
        <div class="row">
            <aside class="col-lg-3 col-md-4 mb-4 p-0">
                <iframe src="content-kiri.html" class="aside-frame" title="Konten Kiri"></iframe>
            </aside>

            <main class="col-lg-9 col-md-8">
                <div class="card shadow-sm mx-auto" style="max-width: 480px;">
                <div class="card-header bg-primary text-white text-center">
                    <i class="bi bi-box-arrow-in-right"></i> <strong>Login</strong>
                </div>
                <div class="card-body p-4">
                    <form>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username / Email</label>
                        <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" placeholder="Masukkan username atau email" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Masukkan password" required>
                        </div>
                    </div>
                    <div class="mb-3 form-check d-flex justify-content-between">
                        <div>
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label" for="remember">Ingat saya</label>
                        </div>
                        <a href="#" class="small">Lupa password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Masuk
                    </button>
                    </form>
                    <hr>
                    <p class="text-center small text-muted mb-0">Belum punya akun? <a href="#">Daftar di sini</a></p>
                </div>
                </div>
            </main>
        </div>
    </div>

    <iframe src="footer.html" class="footer-frame" title="Footer"></iframe>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
